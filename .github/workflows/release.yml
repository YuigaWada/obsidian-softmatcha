name: Prepare draft release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example 0.3.2 (no v prefix)
        required: true
        type: string
      include_models:
        description: Prepare a separate data-only model release
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: github.event_name == 'push' || inputs.include_models
        with:
          python-version: '3.12'
      - name: Prepare public model data
        if: github.event_name == 'push' || inputs.include_models
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --only-binary=:all: numpy==2.2.6
          .local/venv/bin/python scripts/models/prepare.py
          .local/venv/bin/python scripts/models/export.py
      - name: Test with actual models and package
        if: github.event_name == 'push' || inputs.include_models
        run: |
          npm test
          python3 scripts/release/package.py --models
      - name: Package plugin only
        if: github.event_name == 'workflow_dispatch' && !inputs.include_models
        run: python3 scripts/release/package.py
      - name: Attest standard plugin assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Create separate model-data draft
        if: github.event_name == 'push' || inputs.include_models
        run: |
          SM_RELEASE_COMMIT=$(git rev-parse HEAD)
          gh release create "models-$RELEASE_TAG" --target "$SM_RELEASE_COMMIT" --draft --prerelease --latest=false --title "Model data $RELEASE_TAG" --notes "Optional English and Japanese data packs for SoftMatcha Search $RELEASE_TAG. Import ZIPs through plugin settings. The manual-install archive and checksums are included here; this is not an Obsidian plugin update." "dist/models-en-$RELEASE_TAG.zip" "dist/models-ja-$RELEASE_TAG.zip" dist/softmatcha-for-obsidian.zip dist/SHA256SUMS
      - name: Create standard plugin draft
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "SoftMatcha Search $RELEASE_TAG" --generate-notes dist/main.js dist/manifest.json dist/styles.css
